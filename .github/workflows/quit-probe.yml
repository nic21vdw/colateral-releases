name: Mac quit probe
on:
  push:
    branches: [claude/project-thread-fypt59-quitprobe]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Build
        working-directory: probe/quit
        run: cargo build
      - name: Cmd+Q with the predefined Quit item, then with the replacement
        working-directory: probe/quit
        run: |
          for mode in predefined custom; do
            echo "===== $mode"
            PROBE_MODE=$mode ./target/debug/quit-probe > $mode.log 2>&1 &
            PID=$!
            sleep 12
            kill -0 $PID || { echo "app exited early"; cat $mode.log; exit 1; }
            osascript -e "tell application \"System Events\" to tell (first process whose unix id is $PID) to get name of every menu item of menu 1 of menu bar item 1 of menu bar 1" || echo "menu read not permitted"
            osascript -e "tell application \"System Events\" to tell (first process whose unix id is $PID) to get value of attribute \"AXMenuItemCmdChar\" of (last menu item of menu 1 of menu bar item 1 of menu bar 1)" || true
            osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $PID) to true" || true
            sleep 2
            osascript -e 'tell application "System Events" to keystroke "q" using command down' || echo "keystroke not permitted"
            for i in $(seq 1 15); do kill -0 $PID 2>/dev/null || break; sleep 1; done
            if kill -0 $PID 2>/dev/null; then echo "still running after Cmd+Q"; kill $PID; sleep 1; else echo "quit after Cmd+Q"; fi
            cat $mode.log
          done
          echo "===== verdict"
          grep -q "PROBE ExitRequested" predefined.log && echo "predefined Quit DOES emit ExitRequested" || echo "predefined Quit does NOT emit ExitRequested (quit gate is skipped)"
          grep -q "PROBE quit chosen from the menu" custom.log && grep -q "PROBE ExitRequested Some(0)" custom.log && echo "PASS: replacement Quit item reaches the app's handler" || { echo "::error::replacement Quit item did not reach the handler"; exit 1; }
