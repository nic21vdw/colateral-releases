name: macOS 1.0.59 release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-v1.0.59
  cancel-in-progress: false

jobs:
  macos:
    if: github.actor == 'nic21vdw'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          repository: nic21vdw/CoLateral-AI
          ref: 5fcaaab8df9f432102c4934973e4770a35a825a9
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Sync bridge and workspace assets
        working-directory: apps/desktop
        run: npm run sync-assets

      - name: Add both macOS node-pty prebuilds for the universal bundle
        working-directory: apps/bridge
        run: |
          VERSION=$(node -p "require('./node_modules/@lydell/node-pty/package.json').version")
          npm install --no-save --force \
            "@lydell/node-pty-darwin-arm64@$VERSION" \
            "@lydell/node-pty-darwin-x64@$VERSION"
          for ARCH in arm64 x64; do
            test -d "node_modules/@lydell/node-pty-darwin-$ARCH" \
              || { echo "missing darwin-$ARCH prebuild"; exit 1; }
          done

      - name: Configure Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          names = ("APPLE_CERTIFICATE", "APPLE_CERTIFICATE_PASSWORD", "APPLE_SIGNING_IDENTITY", "APPLE_ID", "APPLE_PASSWORD", "APPLE_TEAM_ID")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name in names:
                  value = os.environ[name].strip().lstrip("\ufeff").strip()
                  if name == "APPLE_CERTIFICATE":
                      value = "".join(value.split())
                      base64.b64decode(value, validate=True)
                  if not value or "\n" in value or "\r" in value:
                      raise ValueError("Invalid signing input: " + name)
                  print("::add-mask::" + value)
                  output.write(name + "=" + value + "\n")
          PY

      - name: Sign the bridge's native modules
        working-directory: apps/bridge
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/bridge-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/bridge-signing.p12"
          security import "$RUNNER_TEMP/bridge-signing.p12" \
            -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/bridge-signing.p12"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          BINARIES=$(find node_modules -type f \
            \( -name '*.node' -o -name '*.dylib' -o -perm -u+x \) \
            -exec sh -c 'file -b "$1" | grep -q "Mach-O"' _ {} \; -print)

          if [ -z "$BINARIES" ]; then
            echo "No Mach-O binaries under apps/bridge/node_modules." >&2
            echo "Either the bridge stopped shipping native code, or this step is looking in the wrong place. Signing nothing here means notarisation fails twenty minutes from now instead." >&2
            exit 1
          fi

          echo "$BINARIES" | while read -r BINARY; do
            codesign --force --timestamp --options runtime \
              --keychain "$KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "$BINARY"
            codesign --verify --strict "$BINARY"
          done

          echo "Signed $(echo "$BINARIES" | wc -l | tr -d ' ') native binaries in the bridge." >> "$GITHUB_STEP_SUMMARY"

      - name: Build desktop frontend
        working-directory: apps/desktop
        timeout-minutes: 8
        run: |
          node scripts/ensure-tauri-icon.mjs
          npx next build

      - name: Check canvas in Chromium and WebKit
        working-directory: apps/desktop
        timeout-minutes: 8
        run: |
          node -e "require('node:http').createServer((req,res)=>{res.writeHead(req.method==='OPTIONS'?204:503,{'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'*','Access-Control-Allow-Methods':'GET,POST,OPTIONS','Content-Type':'application/json'});res.end(JSON.stringify({error:'Bridge unavailable in the canvas fixture'}));}).listen(8737,'127.0.0.1')" &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true' EXIT
          npm run test:parity

      - name: Build universal DMG
        timeout-minutes: 30
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --target universal-apple-darwin \
            --config '{"build":{"beforeBuildCommand":""},"bundle":{"active":true,"targets":["app","dmg"]}}'

      - name: Report how the build was signed
        if: env.APPLE_CERTIFICATE != ''
        run: echo "Signed and notarised macOS build." >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          repository: nic21vdw/colateral-releases
          token: ${{ github.token }}
          tag_name: v1.0.59
          draft: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

