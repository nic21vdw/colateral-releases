name: macOS transparency probe

on:
  pull_request:
    paths:
      - .github/workflows/macos-transparency-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Install Chromium and WebKit
        run: |
          mkdir probe && cd probe
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.63.0 > /dev/null
          npx playwright install chromium webkit
      - name: Probe before
        working-directory: probe
        run: |
          defaults read com.apple.universalaccess reduceTransparency || echo "reduceTransparency unset"
          defaults read com.apple.universalaccess reduceMotion || echo "reduceMotion unset"
          cat > probe.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          for (const [name, engine] of [['chromium', chromium], ['webkit', webkit]]) {
            const browser = await engine.launch({ headless: true });
            const page = await browser.newPage();
            const reduce = await page.evaluate(() => matchMedia('(prefers-reduced-transparency: reduce)').matches);
            const known = await page.evaluate(() => matchMedia('(prefers-reduced-transparency)').media);
            console.log(`${name} ${browser.version()}: reduced transparency=${reduce} (${known})`);
            await browser.close();
          }
          JS
          node probe.mjs
      - name: Turn Reduce Transparency off and probe again
        working-directory: probe
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool false || echo "user write refused"
          defaults read com.apple.universalaccess reduceTransparency || true
          node probe.mjs
