# Cloud desktop release: builds, signs and publishes a CoLateral desktop version
# with no developer machine involved. Runs on this public repository's free
# runners and reads the private source through SOURCE_DEPLOY_KEY.
#
# 1. preflight   exact source on CoLateral-AI main, versions agree, nothing published
#                yet, then a draft release v<version> here
# 2. windows, linux, macos   build and upload into the draft (macos reuses macos-release.yml)
# 3. publish     latest.json, payload validation, canary record, stable record, live
#                check, GitHub latest, then the website's desktop-release.json and
#                update-manifest.json as an artifact
#
# Publication follows green builds on its own: preflight, the platform builds and
# the validate and live-updater checks in publish are the gates. No one taps Approve.
name: Desktop release
run-name: Desktop ${{ inputs.tag }} ${{ inputs.source }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, for example v1.0.81
        required: true
      source:
        description: Full CoLateral-AI commit SHA on main that carries this version
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  SOURCE: ${{ inputs.source }}
  COLATERAL_BUILD_SHA: ${{ inputs.source }}

jobs:
  preflight:
    if: github.actor == 'nic21vdw' && github.repository == 'nic21vdw/colateral-releases'
    runs-on: ubuntu-24.04
    environment: mac-release
    timeout-minutes: 15
    steps:
      - name: Reject an already completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_PREFIX: Desktop
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          // Same-tag concurrency serializes publishers. This read-only preflight rejects
          // an already successful identity before checkout, compilation or publication.
          const env = process.env;
          const tag = env.RELEASE_TAG;
          const source = env.RELEASE_SOURCE?.toLowerCase();
          const prefix = env.RELEASE_PREFIX;
          try {
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag || '') || !/^[a-f0-9]{40}$/.test(source || '')) {
              throw new Error('Expected a stable version tag and full source SHA.');
            }
            if (!['Desktop', 'macOS'].includes(prefix) || !/^[\w.-]+\/[\w.-]+$/.test(env.GITHUB_REPOSITORY || '')
                || !/^[1-9][0-9]*$/.test(env.GITHUB_RUN_ID || '') || !/^[1-9][0-9]*$/.test(env.GITHUB_RUN_ATTEMPT || '')
                || !env.GH_TOKEN) throw new Error('Missing or invalid dispatch context.');
            const attempt = Number(env.GITHUB_RUN_ATTEMPT);
            if (attempt > 20) throw new Error('Too many attempts to verify safely; review run history.');
            const base = `https://api.github.com/repos/${env.GITHUB_REPOSITORY}/actions`;
            async function get(path) {
              const response = await fetch(`${base}/${path}`, {
                headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
                signal: AbortSignal.timeout(20000), redirect: 'error',
              });
              if (!response.ok) throw new Error(`Cannot verify completed runs (HTTP ${response.status}); refusing to build.`);
              return response.json();
            }
            const title = `${prefix} ${tag} ${source}`.toLowerCase();
            const current = await get(`runs/${env.GITHUB_RUN_ID}`);
            if (!Number.isSafeInteger(current.workflow_id) || current.workflow_id <= 0
                || current.event !== 'workflow_dispatch' || current.display_title?.toLowerCase() !== title) {
              throw new Error('Run identity does not match the requested tag and source.');
            }
            const reject = id => { throw new Error(`Release ${tag} at ${source} already completed in run ${id}. Reuse its result; no build or publication was started.`); };
            // A rerun keeps its run ID and hides the old conclusion in the run listing.
            async function checkAttempts(id, count) {
              if (!Number.isSafeInteger(count) || count < 1 || count > 20) throw new Error('Cannot verify previous attempts safely.');
              for (let previous = 1; previous < count; previous++) {
                const run = await get(`runs/${id}/attempts/${previous}`);
                if (run.conclusion === 'success') reject(id);
                if (run.status !== 'completed') throw new Error('Previous attempt is not verifiably complete.');
              }
            }
            await checkAttempts(env.GITHUB_RUN_ID, attempt);
            const seen = new Set();
          let historyCount = null;
            for (let page = 1; page <= 10; page++) {
              const data = await get(`workflows/${current.workflow_id}/runs?per_page=100&page=${page}`);
              // Bound the lookup; never treat truncated or shifting history as absence.
              if (!Number.isSafeInteger(data.total_count) || data.total_count < 0 || data.total_count > 1000
                  || !Array.isArray(data.workflow_runs)) throw new Error('Incomplete run history; review before dispatch.');
              if (historyCount !== null && data.total_count !== historyCount) throw new Error('Run history changed during lookup; refusing to build.');
              historyCount = data.total_count;
              for (const run of data.workflow_runs) {
                if (!Number.isSafeInteger(run.id) || typeof run.display_title !== 'string'
                    || typeof run.status !== 'string' || seen.has(run.id)) throw new Error('Invalid or shifting run history.');
                seen.add(run.id);
                const sameTitle = run.display_title.toLowerCase() === title;
                const legacyTagPush = run.event === 'push' && run.head_branch === tag && run.head_sha?.toLowerCase() === source;
                if (sameTitle || legacyTagPush) {
                  if (run.conclusion === 'success') reject(run.id);
                  if (String(run.id) !== env.GITHUB_RUN_ID) await checkAttempts(run.id, run.run_attempt);
                }
              }
              if (seen.size >= data.total_count) break;
              if (!data.workflow_runs.length || page === 10) throw new Error('Incomplete run history; refusing to build.');
            }
            console.log('No completed release with this tag/source in retained workflow history. Existing source and publication gates still apply.');
          } catch (error) {
            console.error(`::error::${error.message}`);
            process.exitCode = 1;
          }
          NODE
      - name: Check inputs
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]] || { echo "source must be a full commit SHA"; exit 1; }

      - name: Build secrets are present
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          MISSING=""
          for NAME in SOURCE_DEPLOY_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing secrets in the mac-release environment:$MISSING"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: nic21vdw/CoLateral-AI
          ref: main
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: README.md
          path: history
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Source is on main
        working-directory: history
        run: git merge-base --is-ancestor "$SOURCE" HEAD || { echo "$SOURCE is not on CoLateral-AI main"; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: nic21vdw/CoLateral-AI
          ref: ${{ inputs.source }}
          path: source
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Source carries this version
        working-directory: source
        run: |
          WANT="${TAG#v}"
          CONF=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          CARGO=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{match($0,/"[^"]*"/);print substr($0,RSTART+1,RLENGTH-2);exit}' apps/desktop/src-tauri/Cargo.toml)
          if [ "$WANT" != "$CONF" ] || [ "$WANT" != "$PKG" ] || [ "$WANT" != "$CARGO" ]; then
            echo "Version mismatch: tag $TAG, tauri.conf.json $CONF, package.json $PKG, Cargo.toml $CARGO. Merge the version cut first." >&2
            exit 1
          fi
          echo "Building $WANT from $SOURCE (on main)." >> "$GITHUB_STEP_SUMMARY"

      - name: Version is not already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null || echo "absent")
          case "$STATE" in
            absent|"true "*|*" true") echo "Release $TAG: $STATE" ;;
            *) echo "$TAG is already a stable release here. Cut a new version." >&2; exit 1 ;;
          esac

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Create or reuse the draft release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-pipeline.mjs prepare

  windows:
    needs: preflight
    runs-on: windows-latest
    environment: mac-release
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: nic21vdw/CoLateral-AI
          ref: ${{ inputs.source }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/bridge/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Configure Authenticode signing
        id: signing
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          PRESENT=0; MISSING=""
          for NAME in AZURE_ENDPOINT AZURE_ACCOUNT AZURE_CERT_PROFILE AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            if [ -n "${!NAME}" ]; then PRESENT=$((PRESENT + 1)); else MISSING="$MISSING $NAME"; fi
          done
          if [ -n "$MISSING" ]; then
            echo 'config={"bundle":{"active":true,"targets":["nsis"]}}' >> "$GITHUB_OUTPUT"
            if [ "$PRESENT" -gt 0 ]; then echo "::warning title=Windows build is unsigned::Azure Artifact Signing is $PRESENT/6 configured. Missing:$MISSING"; fi
            echo "Windows installer has no Authenticode signature (Azure Artifact Signing $PRESENT/6 configured). The updater signature is still required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SIGNTOOL=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin"/*/x64/signtool.exe 2>/dev/null | sort -V | tail -1)
          [ -n "$SIGNTOOL" ] || { echo "No signtool.exe on this runner." >&2; exit 1; }
          echo "SIGNTOOL_PATH=$(cygpath -w "$SIGNTOOL")" >> "$GITHUB_ENV"
          AZ_CLI="/c/Program Files/Microsoft SDKs/Azure/CLI2/wbin/az.cmd"
          [ -f "$AZ_CLI" ] || { echo "No Azure CLI at $AZ_CLI." >&2; exit 1; }
          echo "AZURE_CLI_PATH=$(cygpath -w "$AZ_CLI")" >> "$GITHUB_ENV"
          cargo install artifact-signing-cli --locked
          printf 'config={"bundle":{"active":true,"targets":["nsis"],"windows":{"signCommand":"artifact-signing-cli -e %s -d CoLateral %%1"}}}\n' \
            "$AZURE_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "Windows installer signed through Azure Artifact Signing." >> "$GITHUB_STEP_SUMMARY"

      - name: Build the Windows installer
        working-directory: apps/desktop
        timeout-minutes: 60
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COLATERAL_GOOGLE_CLIENT_ID: ${{ secrets.COLATERAL_GOOGLE_CLIENT_ID }}
          COLATERAL_GOOGLE_CLIENT_SECRET: ${{ secrets.COLATERAL_GOOGLE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: npx tauri build --config '${{ steps.signing.outputs.config }}'

      - name: Upload Windows payloads and source receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-pipeline.mjs upload --platform windows

  linux:
    needs: preflight
    runs-on: ubuntu-22.04
    environment: mac-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: nic21vdw/CoLateral-AI
          ref: ${{ inputs.source }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/bridge/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev librsvg2-bin libgdk-pixbuf2.0-dev libxdo-dev libssl-dev \
            libfuse2 desktop-file-utils build-essential patchelf file

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the Debian package
        working-directory: apps/desktop
        timeout-minutes: 45
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COLATERAL_GOOGLE_CLIENT_ID: ${{ secrets.COLATERAL_GOOGLE_CLIENT_ID }}
          COLATERAL_GOOGLE_CLIENT_SECRET: ${{ secrets.COLATERAL_GOOGLE_CLIENT_SECRET }}
        run: npx tauri build --config '{"bundle":{"active":true,"targets":["deb"]}}'

      - name: Drop musl prebuilds the AppImage cannot use
        run: |
          find apps/bridge/node_modules -name '*musl*' -prune -print 2>/dev/null | while read -r DROP; do
            [ -n "$DROP" ] && rm -rf "$DROP"
          done

      - name: Build the AppImage and Debian package
        working-directory: apps/desktop
        timeout-minutes: 30
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COLATERAL_GOOGLE_CLIENT_ID: ${{ secrets.COLATERAL_GOOGLE_CLIENT_ID }}
          COLATERAL_GOOGLE_CLIENT_SECRET: ${{ secrets.COLATERAL_GOOGLE_CLIENT_SECRET }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 'true'
        run: |
          npx tauri build --verbose \
            --config '{"build":{"beforeBuildCommand":""},"bundle":{"active":true,"targets":["appimage","deb"]}}'

      - name: Upload Linux payloads and source receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-pipeline.mjs upload --platform linux

  macos:
    needs: preflight
    uses: ./.github/workflows/macos-release.yml
    with:
      tag: ${{ inputs.tag }}
      source: ${{ inputs.source }}
      called: true
    secrets: inherit

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    environment: mac-release
    timeout-minutes: 45
    env:
      FULFILMENT_RELEASE_UPLOAD_TOKEN: ${{ secrets.FULFILMENT_RELEASE_UPLOAD_TOKEN }}
    steps:
      - name: Publish secret is present
        run: |
          [ -n "$FULFILMENT_RELEASE_UPLOAD_TOKEN" ] || { echo "::error::FULFILMENT_RELEASE_UPLOAD_TOKEN is missing from the mac-release environment."; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: nic21vdw/CoLateral-AI
          ref: ${{ inputs.source }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Download every staged payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir installers

      - name: Build the updater manifest
        run: |
          notes="$(node apps/desktop/scripts/release-notes.mjs --version "$TAG")"
          node apps/desktop/scripts/build-updater-manifest.mjs --dir installers --version "$TAG" \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --notes "$notes" --out installers/latest.json

      - name: Validate payloads, receipts and updater signatures
        run: node scripts/desktop-pipeline.mjs validate --dir installers

      - name: Publish the prerelease and canary record
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-pipeline.mjs canary --dir installers

      - name: Promote the stable release record
        run: node scripts/publish-release-record.mjs --dir installers --source "$SOURCE" --channel stable

      - name: Confirm the live updater and mark the release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/desktop-pipeline.mjs live --dir installers
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "Published $TAG from $SOURCE. https://colateralai.com/download" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the website's download files
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, readdirSync, writeFileSync, copyFileSync } from 'node:fs';
          import { downloadRelease } from './scripts/lib/releaseGuards.mjs';
          const version = process.env.TAG.slice(1);
          const previous = JSON.parse(readFileSync('apps/web/desktop-release.json', 'utf8'));
          const next = downloadRelease({ version, stagedFiles: readdirSync('installers'), previous });
          mkdirSync('website-files', { recursive: true });
          writeFileSync('website-files/desktop-release.json', `${JSON.stringify({ _comment: previous._comment, ...next }, null, 2)}\n`);
          copyFileSync('installers/latest.json', 'website-files/update-manifest.json');
          NODE
          echo "Commit website-files to apps/web/desktop-release.json and apps/web/update-manifest.json in CoLateral-AI." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-files-${{ inputs.tag }}
          path: website-files/
